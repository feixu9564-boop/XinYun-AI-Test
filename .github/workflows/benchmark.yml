name: Offline benchmark engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU baseline dependencies
        run: bash scripts/install-benchmark.sh
      - name: Ingestion contracts, explicit real-data blocker and existing PR6 regression
        run: .venv/bin/python scripts/validate-phase4.py --out outputs/phase4-validation
      - name: Preserve synthetic engineering logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-engineering-logs
          path: outputs/phase4-validation
          if-no-files-found: warn
