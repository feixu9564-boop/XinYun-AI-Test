name: Mobile browser engineering checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: pip install -r requirements-benchmark.lock
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Record contract and existing algorithm port parity
        run: |
          mkdir -p test-results
          npm test | tee test-results/node.log
          python scripts/check-mobile-parity.py | tee test-results/parity.log
          python scripts/check-v062.py | tee test-results/v062-numerical.log
          python -m pytest tests/test_mobile_csv.py -q | tee test-results/csv.log
      - name: Desktop engines with mobile viewport and explicit camera mocks
        run: |
          npm start > test-results/server.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          npm run test:browser | tee test-results/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-engineering-only
          path: test-results/
